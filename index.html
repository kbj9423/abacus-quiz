<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주판 덧셈 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9dccb;font-family:"Gowun Dodum",sans-serif;color:#f4f4ee}
ul{list-style:none;margin:0;padding:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
.board{padding:30px 26px 40px;background:#2f4a3c radial-gradient(circle at 30% 20%,#3a5a49,#2f4a3c 70%);border:16px solid #8b5a2b;border-radius:8px;box-shadow:inset 0 0 70px rgba(0,0,0,.35)}
.tray{height:14px;margin:0 24px;background:#a06a3a;border-radius:0 0 8px 8px}
h1{margin:0 0 22px;font:400 44px/1.1 "Black Han Sans",sans-serif}
.lead{margin:0 0 18px;font-size:20px;color:#cfe3d6}
.levels li{margin-bottom:12px}
.level{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:2px dashed rgba(244,244,238,.35);border-radius:8px;background:none;color:inherit;text-align:left}
.level:hover{background:rgba(255,255,255,.06)}
.level b{font:400 26px/1.2 "Black Han Sans",sans-serif}
.level span{font-size:17px;color:#cfe3d6}
.lv{display:inline-block;flex:none;padding:4px 12px;border:0;border-radius:999px;font-size:16px;font-weight:700;color:#1f2d24;vertical-align:middle}
.lv.s1{background:#8ce99a}.lv.s3{background:#ffe066}.lv.s5{background:#ff8787}
.pick{display:flex;gap:10px;margin:18px 0 0}
.pick .lv{min-height:40px;padding:4px 16px;font-size:18px;opacity:.4}
.pick .lv.on{opacity:1;outline:3px solid #f4f4ee;outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;font-size:18px;color:#cfe3d6}
.timer{font:400 28px/1 "Black Han Sans",sans-serif;color:#f6e27f}
.sum{width:max-content;margin:0 auto;padding:0 10px 6px;border-bottom:4px solid #f4f4ee;font:400 40px/1.15 "Black Han Sans",sans-serif;text-align:right}
.sum span{display:inline-block;width:.62em;text-align:center}
.play{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:14px auto 0;max-width:340px}
.chalkline{flex:1;min-width:120px;border-bottom:4px solid #f6e27f}
.chalkline input{width:100%;padding:0;border:0;background:none;font:400 40px/1.3 "Black Han Sans",sans-serif;color:#f6e27f}
.play .chalkline input{text-align:right}
.play .chalkline input.wrong{color:#ff8787}
.field{display:flex;align-items:flex-end;gap:12px;margin:18px 0 4px;font-size:22px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{min-height:48px;padding:6px 18px;border:2px solid #f4f4ee;border-radius:8px;background:none;color:inherit;font-size:19px}
.btn.main{background:#f6e27f;border-color:#f6e27f;color:#1f2d24;font-weight:700}
.btn:disabled,input:disabled{opacity:.5;cursor:default}
.msg{min-height:1.6em;margin:14px 0 0;font-size:19px;line-height:1.6;color:#ffd8a8;text-align:center}
.opp{margin:6px 0 0;font-size:17px;color:#cfe3d6;text-align:center}
.end{margin:0 0 10px;font:400 40px/1.2 "Black Han Sans",sans-serif}
.res li{display:flex;gap:12px;padding:10px 0;border-bottom:2px dashed rgba(244,244,238,.22);font-size:20px}
.res .who{flex:1}
.res b{font:400 26px/1.2 "Black Han Sans",sans-serif}
.ok{color:#8ce99a}.no{color:#ff8787}
.record{margin:22px 0 0;padding-top:16px;border-top:2px dashed rgba(244,244,238,.35);font-size:19px;color:#f6e27f}
.source{margin:14px 8px 0;font-size:13px;line-height:1.6;color:#6b5a45}
@media (max-width:520px){
  .board{padding:22px 16px 30px;border-width:10px}
  h1{font-size:32px;margin-bottom:14px}
  .sum{font-size:36px}
  .chalkline input{font-size:32px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <h1>주판 덧셈 대결</h1>
    <div class="out"></div>
  </div>
  <div class="tray"></div>
  <p class="source">문제 기준: 한국주산협회 주산 급수 검정기준을 참고해 덧셈만 냅니다.</p>
</div>

<script>
// 난이도: 쉬움은 보수가 꼭 나오는 문제, 중간·어려움은 무작위(보수가 저절로 섞여 나온다)
const LEVELS = [
  {name:"쉬움",   desc:"한 자리 4줄. 더할 때마다 5의 짝·10의 보수가 나와요."},
  {name:"중간",   desc:"한 자리 6줄, 또는 두 자리 4줄을 더해요."},
  {name:"어려움", desc:"두 자리 5줄을 더해요."}
];
const COLOR = ["s1", "s3", "s5"];
const SOLO = 5;    // 혼자하기 문제 수
const LIMIT = 30;  // 같이하기 한 문제 제한 시간(초)
const WIN = 3;     // 같이하기 최종 승리에 필요한 승수

// 한 자리 더하기 동작: d=주판에 놓인 일의 자리 숫자, n=더할 숫자
function kind(d, n){
  if (d + n >= 10) { const c = 10 - n; return d >= 5 && c < 5 && d - 5 < c ? "mix" : "ten"; }  // mix=5와 10 섞임, ten=10의 보수
  return n < 5 && d < 5 && d + n >= 5 ? "five" : "direct";  // five=5의 짝, direct=바로 더하기
}
// 쉬움: 더하는 세 번이 모두 보수인 한 자리 4줄 조합을 미리 모아 둔다
const EASY = [];
for (let i = 0; i < 6561; i++) {
  const nums = [0, 1, 2, 3].map(k => Math.floor(i / 9 ** k) % 9 + 1);
  let t = nums[0];
  if (nums.slice(1).every(n => { const k = kind(t % 10, n); t += n; return k !== "direct"; })) EASY.push(nums);
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = d => 10 ** (d - 1) + Math.floor(Math.random() * 9 * 10 ** (d - 1));
const rows = (d, n) => Array.from({length: n}, () => rnd(d));
function makeNums(lv){
  if (lv === 0) return pick(EASY).slice();
  if (lv === 1) return Math.random() < 0.5 ? rows(1, 6) : rows(2, 4);
  return rows(2, 5);
}
const total = nums => nums.reduce((a, b) => a + b, 0);
const sec = ms => `${(ms / 1000).toFixed(1)}초`;
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const problem = nums => `<div class="sum">${nums.map(n => `<div>${[...String(n)].map(d => `<span>${d}</span>`).join("")}</div>`).join("")}</div>`;
const answerForm = `<form class="play"><span class="chalkline"><input aria-label="답" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="send"></span><button class="btn main">내기</button></form>`;

// 같이하기 기록: 문제 한 판마다 이 기기에 저장한다 (무승부는 세지 않음)
let rec = {games: 0, win: 0, lose: 0};
try { rec = JSON.parse(localStorage.getItem("abacus-record")) || rec; } catch (e) {}
function addRecord(win){
  rec.games++; win ? rec.win++ : rec.lose++;
  try { localStorage.setItem("abacus-record", JSON.stringify(rec)); } catch (e) {}
}
const recordLine = () => `<p class="record">${rec.games ? `내 기록 ${rec.games}판 ${rec.win}승 ${rec.lose}패 · 승률 ${Math.round(rec.win / rec.games * 100)}%` : "내 기록: 아직 같이하기를 하지 않았어요."}</p>`;

const out = document.querySelector(".out");
// mode: "solo" 또는 "online", startAt: 지금 문제가 나온 시각, tries: 혼자하기에서 지금 문제에 답을 낸 횟수
let mode, level, nums, startAt, results, tries;
// 같이하기: net=Firebase 연결(online.js), me=host/guest, room=방 정보, seen=지금 보고 있는 문제 번호, sent=답을 냈는지
let net, code, me, room, seen, sent, recorded, unwatch, nextTimer;
let pickLv = 0;
let nick = "";
try { nick = localStorage.getItem("abacus-nickname") || ""; } catch (e) {}
const online = () => mode === "online";
const other = s => s === "host" ? "guest" : "host";
const opp = () => esc(me === "host" ? room.guestName : room.hostName);

function home(){
  mode = null;
  out.innerHTML = `<p class="lead">혼자 연습하거나, 방 코드로 친구와 같이 해요.</p>
    <ul class="levels">
      <li><button class="level" data-act="solo"><span><b>혼자하기</b><br><span>난이도를 골라 ${SOLO}문제를 풀어요.</span></span></button></li>
      <li><button class="level" data-act="together"><span><b>같이하기</b><br><span>같은 문제를 동시에 풀어 ${WIN}번 먼저 이기면 승리해요.</span></span></button></li>
    </ul>${recordLine()}`;
}

function solo(){
  mode = null;
  out.innerHTML = `<p class="lead">난이도를 골라 주판으로 ${SOLO}문제를 풀어요.</p>
    <ul class="levels">${LEVELS.map((l, i) => `<li><button class="level" data-level="${i}">
      <span class="lv ${COLOR[i]}">${i + 1}</span><span><b>${l.name}</b><br><span>${l.desc}</span></span>
    </button></li>`).join("")}</ul>
    <div class="btns"><button class="btn" data-act="home">처음으로</button></div>`;
}

function start(i){
  mode = "solo"; level = i; results = [];
  ask();
}

function ask(){
  nums = makeNums(level); startAt = Date.now(); tries = 0;
  out.innerHTML = `<div class="top"><span class="lv ${COLOR[level]}">${LEVELS[level].name}</span><span>${results.length + 1} / ${SOLO}</span></div>
    ${problem(nums)}${answerForm}<p class="msg"></p>`;
}

function say(msg){ out.querySelector(".msg").textContent = msg; }

function send(){
  const input = out.querySelector(".play input");
  if (!input || input.disabled) return;
  const v = input.value.trim();
  if (!/^\d+$/.test(v)) return say("숫자로 답을 써 주세요.");
  const t = Date.now() - startAt;
  if (online()) return submit(+v, t);
  // 혼자하기는 틀리면 넘어가지 않고 맞힐 때까지 다시 푼다
  tries++;
  if (+v !== total(nums)) { input.classList.add("wrong"); return say("오답이에요. 다시 풀어 보세요."); }
  results.push({tries, t});
  startAt = null;
  const lastOne = results.length === SOLO;
  out.innerHTML = `<div class="top"><span class="lv ${COLOR[level]}">${LEVELS[level].name}</span><span>${results.length} / ${SOLO}</span><span class="timer">${sec(t)}</span></div>
    ${problem(nums)}
    <p class="end ok" style="text-align:center">맞았어요! ${total(nums)}</p>
    <div class="btns" style="justify-content:center"><button class="btn main" data-act="${lastOne ? "summary" : "next"}">${lastOne ? "결과 보기" : "다음 문제"}</button></div>`;
  out.querySelector(".btn.main").focus();
}

function summary(){
  const n = results.filter(r => r.tries === 1).length;
  out.innerHTML = `<p class="end">${SOLO}문제 중 ${n}개를 한 번에 맞혔어요</p>
    <p class="lead">${LEVELS[level].name} · 모두 ${sec(total(results.map(r => r.t)))} 걸렸어요.</p>
    <ul class="res">${results.map((r, i) => `<li><span class="who">${i + 1}번</span><span class="${r.tries === 1 ? "ok" : "no"}">${r.tries === 1 ? "한 번에" : `${r.tries}번 만에`}</span><span>${sec(r.t)}</span></li>`).join("")}</ul>
    <div class="btns"><button class="btn main" data-act="again">다시 하기</button><button class="btn" data-act="solo">난이도 바꾸기</button></div>`;
}

// ===== 같이하기 =====
function together(msg){
  mode = null;
  out.innerHTML = `<p class="lead">방을 만들 때 난이도를 골라요. 한 문제에 ${LIMIT}초, 둘 다 맞히면 더 빨리 푼 사람이 이겨요.</p>
    <label class="field"><span>닉네임</span><span class="chalkline"><input id="nick" maxlength="10" autocomplete="off" value="${esc(nick)}"></span></label>
    <div class="pick">${LEVELS.map((l, i) => `<button class="lv ${COLOR[i]}${i === pickLv ? " on" : ""}" data-pick="${i}">${l.name}</button>`).join("")}</div>
    <div class="btns"><button class="btn main" data-act="create">방 만들기</button></div>
    <label class="field"><span>방 코드</span><span class="chalkline"><input id="code" inputmode="numeric" maxlength="4" autocomplete="off"></span></label>
    <div class="btns"><button class="btn main" data-act="join">들어가기</button><button class="btn" data-act="home">처음으로</button></div>
    <p class="msg">${msg || ""}</p>`;
}

async function enter(act){
  const name = out.querySelector("#nick").value.trim(), c = out.querySelector("#code").value.trim();
  if (!name) return say("닉네임을 써 주세요.");
  if (act === "join" && !/^\d{4}$/.test(c)) return say("방 코드 네 자리를 써 주세요.");
  say("연결하는 중이에요…");
  try {
    net = net || await import("./online.js");
    if (await net.containsProfanity(name)) return say("닉네임에 쓸 수 없는 말이 있어요.");
    nick = name;
    try { localStorage.setItem("abacus-nickname", name); } catch (e) {}
    if (act === "create") { code = await net.create(name, pickLv); me = "host"; }
    else {
      const err = await net.join(c, name, makeNums);
      if (err) return say(err);
      code = c; me = "guest";
    }
  } catch (e) { return say("연결하지 못했어요. 잠시 뒤 다시 해 보세요."); }
  mode = "online"; room = null; seen = recorded = "";
  unwatch = net.watch(code, onRoom);
}

function onRoom(r){
  if (!r) { stop(); return together("방이 닫혔어요. 상대가 나갔을 수 있어요."); }
  room = r;
  if (r.status === "waiting") return out.innerHTML = `<p class="lead">방 코드</p><p class="end">${code}</p>
    <p class="lead"><span class="lv ${COLOR[r.level]}">${LEVELS[r.level].name}</span> 상대에게 이 코드를 알려 주세요. 들어오면 바로 시작해요.</p>
    <div class="btns"><button class="btn" data-act="leave">나가기</button></div>`;
  const key = `${r.match}-${r.round}`;
  if (key !== seen) { seen = key; sent = false; startAt = Date.now(); clearTimeout(nextTimer); if (!r.result) return askOnline(); }
  if (r.result) return roundResult();
  const el = out.querySelector(".opp");  // 상대가 답을 냈는지만 바뀌었으면 그것만 고친다 (입력 중인 답이 지워지지 않게)
  if (el) el.textContent = r.ans[other(me)] ? `${opp()}이(가) 답을 냈어요.` : `${opp()}이(가) 풀고 있어요.`;
}

const scoreText = () => `나 ${room.score[me]} : ${room.score[other(me)]} ${opp()}`;

function askOnline(){
  out.innerHTML = `<div class="top"><span class="lv ${COLOR[room.level]}">${room.round}번째 문제</span><span>${scoreText()}</span></div>
    ${problem(room.nums)}${answerForm}<p class="msg"></p><p class="opp">${opp()}이(가) 풀고 있어요.</p>`;
}

// 답 보내기 (v=null 이면 시간 초과)
function submit(v, t){
  sent = true;
  for (const el of out.querySelectorAll(".play input, .play button")) el.disabled = true;
  say(v === null ? "시간이 다 됐어요. 상대를 기다리는 중이에요." : `냈어요. ${sec(t)} · 상대를 기다리는 중이에요.`);
  net.answer(code, me, room.match, room.round, v, t).catch(() => {
    sent = false;
    for (const el of out.querySelectorAll(".play input, .play button")) el.disabled = false;
    say("보내지 못했어요. 다시 눌러 보세요.");
  });
}

function roundResult(){
  const r = room, res = r.result, ans = total(r.nums);
  clearTimeout(nextTimer);
  if (res !== "draw" && recorded !== seen) { recorded = seen; addRecord(res === me); }
  const line = (who, name) => {
    const a = r.ans[who];
    return `<li><span class="who">${name}</span>${a.v === null ? `<span class="no">시간 초과</span>` : `<b class="${a.v === ans ? "ok" : "no"}">${a.v}</b>`}<span>${a.v === null ? "" : sec(a.t)}</span></li>`;
  };
  const over = r.status === "over";
  out.innerHTML = `<div class="top"><span class="lv ${COLOR[r.level]}">${r.round}번째 문제</span><span>${scoreText()}</span></div>
    <p class="end">${over ? (r.winner === me ? "최종 승리!" : "최종 패배") : res === "draw" ? "무승부" : res === me ? "승리!" : "패배"}</p>
    <p class="lead">${res === "draw" ? "둘 다 틀려서 이번 문제는 세지 않아요." : `정답은 ${ans}이에요.`}</p>
    <ul class="res">${line(me, "나")}${line(other(me), opp())}</ul>
    ${over ? `<div class="btns"><button class="btn main" data-act="rematch">다시 하기</button><button class="btn" data-act="leave">나가기</button></div>`
      : `<p class="lead" style="margin-top:14px">곧 다음 문제가 나와요.</p>`}
    ${recordLine()}`;
  // 다음 문제는 두 사람이 모두 요청하지만 먼저 도착한 한 번만 반영된다
  if (!over) nextTimer = setTimeout(() => net.next(code, r.match, r.round, makeNums(r.level)).catch(() => {}), 4000);
}

function stop(){
  if (unwatch) unwatch();
  clearTimeout(nextTimer);
  unwatch = null; room = null; mode = null;
}

function leave(msg){
  const c = code;
  stop();
  net.remove(c).catch(() => {});
  msg ? together(msg) : home();
}

// 같이하기 시간 확인 (푸는 중에는 시간을 보여 주지 않는다). 시간이 다 되면 틀린 것으로 내고, 상대가 한참 답이 없으면 대결을 끝낸다.
function tick(){
  if (!online() || !room || room.status !== "playing" || room.result) return;
  const left = LIMIT - (Date.now() - startAt) / 1000;
  if (!sent && !room.ans[me] && left <= 0) submit(null, LIMIT * 1000);
  else if (!room.ans[other(me)] && left <= -8) leave("상대의 응답이 없어 대결을 끝냈어요.");
}
setInterval(tick, 100);

out.addEventListener("submit", ev => { ev.preventDefault(); send(); });
out.addEventListener("input", ev => ev.target.classList.remove("wrong"));  // 답을 고치기 시작하면 빨간색을 푼다
out.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.level) return start(+b.dataset.level);
  if (b.dataset.pick) {
    pickLv = +b.dataset.pick;
    for (const p of out.querySelectorAll("[data-pick]")) p.classList.toggle("on", p === b);
    return;
  }
  const act = b.dataset.act;
  if (act === "next") ask();
  else if (act === "summary") summary();
  else if (act === "again") start(level);
  else if (act === "solo") solo();
  else if (act === "home") home();
  else if (act === "together") together();
  else if (act === "create" || act === "join") enter(act);
  else if (act === "rematch") net.rematch(code, makeNums(room.level));
  else if (act === "leave") leave();
});

home();
</script>
</body>
</html>
